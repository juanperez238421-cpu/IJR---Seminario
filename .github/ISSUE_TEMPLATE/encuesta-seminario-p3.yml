name: Encuesta Seminario 11° — Tercer periodo
description: Encuesta corta para elegir temática y modalidad de trabajo.
title: "[Encuesta P3] "
body:
  - type: markdown
    attributes:
      value: |
        # Seminario de Programación — Grado 11°
        Responde esta encuesta corta para organizar los proyectos del tercer periodo.

  - type: input
    id: student_name
    attributes:
      label: Nombre completo
      placeholder: Escribe tu nombre y apellidos
    validations:
      required: true

  - type: dropdown
    id: group
    attributes:
      label: Grupo
      options:
        - 11-A
        - 11-B
        - 11-C
    validations:
      required: true

  - type: dropdown
    id: topics
    attributes:
      label: ¿Qué temáticas te gustaría trabajar?
      description: Puedes seleccionar una o varias.
      multiple: true
      options:
        - Desarrollo web
        - Ciencia de datos con Python
        - Ciberseguridad defensiva
        - Diseño 3D + programación
        - Robótica y automatización
        - Otra propuesta
    validations:
      required: true

  - type: dropdown
    id: work_mode
    attributes:
      label: ¿Cómo quieres trabajar?
      options:
        - Individual
        - En pareja
    validations:
      required: true

  - type: input
    id: partner
    attributes:
      label: Si trabajarás en pareja, escribe el nombre de tu compañero(a)
      placeholder: Opcional

  - type: textarea
    id: idea
    attributes:
      label: Idea de proyecto
      description: Opcional. Escribe brevemente qué te gustaría crear.
      placeholder: Ejemplo: una app para...
