name: Render Seminar 11 OOP Immersive V9 Final

on:
  push:
    branches:
      - render/seminario11-poo-intro-20260818
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python syntax gate
        run: |
          python -m py_compile renders/seminar11_oop_immersive_v8_payload.py
          python -m py_compile renders/seminar11_oop_immersive_v9_overlay.py

      - name: Pull pinned ManimCE image
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Quick visual render -pql
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.08 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/fakebin /tmp/manim-home delivery
              printf "#!/usr/bin/env sh\nexit 0\n" > /tmp/fakebin/xdg-open
              chmod +x /tmp/fakebin/xdg-open
              export PATH="/tmp/fakebin:$PATH"
              manim -pql renders/seminar11_oop_immersive_v9_overlay.py Seminar11OOPImmersiveV9 --format=mp4 --disable_caching
            '

      - name: Render final literal -pqh
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/fakebin /tmp/manim-home delivery
              printf "#!/usr/bin/env sh\nexit 0\n" > /tmp/fakebin/xdg-open
              chmod +x /tmp/fakebin/xdg-open
              export PATH="/tmp/fakebin:$PATH"
              manim -pqh renders/seminar11_oop_immersive_v9_overlay.py Seminar11OOPImmersiveV9 --format=mp4 --disable_caching
            '

      - name: Collect and validate deliverable
        run: |
          set -euo pipefail
          mkdir -p delivery
          VIDEO="$(find media -type f -path '*1080p30*' -name 'Seminar11OOPImmersiveV9.mp4' | head -n 1)"
          test -n "$VIDEO"
          test -s "$VIDEO"
          cp "$VIDEO" delivery/Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V9_pqh.mp4
          cp renders/seminar11_oop_immersive_v8_payload.py delivery/
          cp renders/seminar11_oop_immersive_v9_overlay.py delivery/
          test -s delivery/seminar11_oop_immersive_v8_EXPANDED.py
          python -m py_compile delivery/seminar11_oop_immersive_v8_EXPANDED.py
          python -m py_compile delivery/seminar11_oop_immersive_v9_overlay.py
          sha256sum delivery/Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V9_pqh.mp4 > delivery/SHA256.txt
          if command -v ffprobe >/dev/null 2>&1; then
            ffprobe -v error \
              -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
              -show_entries format=duration,size \
              -of default=noprint_wrappers=1 \
              delivery/Seminar11_OOP_Immersive_EN_SENIOR_QA_FINAL_V9_pqh.mp4 | tee delivery/FFPROBE.txt
          else
            echo 'ffprobe unavailable on host; final probe will run after artifact download.' | tee delivery/FFPROBE.txt
          fi
          ls -lh delivery

      - name: Upload rendered video and traceability files
        uses: actions/upload-artifact@v4
        with:
          name: seminar11-oop-immersive-v9-final-pqh
          path: delivery/
          if-no-files-found: error
          retention-days: 7
