name: Render Seminario 11 OOP Visual Concepts

on:
  push:
    branches:
      - render/seminario11-poo-intro-20260818
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull pinned ManimCE image
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Render final literal -pqh
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/fakebin /tmp/manim-home
              printf "#!/usr/bin/env sh\nexit 0\n" > /tmp/fakebin/xdg-open
              chmod +x /tmp/fakebin/xdg-open
              export PATH="/tmp/fakebin:$PATH"
              manim -pqh renders/seminario11_oop_visual_concepts_v4.py Seminar11OOPVisualConcepts --format=mp4 --disable_caching
            '

      - name: Collect and validate deliverable
        run: |
          set -euo pipefail
          mkdir -p delivery
          VIDEO="$(find media -type f -name 'Seminar11OOPVisualConcepts.mp4' | head -n 1)"
          test -n "$VIDEO"
          test -s "$VIDEO"
          cp "$VIDEO" delivery/Seminar11_OOP_Visual_Concepts_EN_QA_FINAL_pqh.mp4
          cp renders/seminario11_oop_visual_concepts_v4.py delivery/
          sha256sum delivery/Seminar11_OOP_Visual_Concepts_EN_QA_FINAL_pqh.mp4 > delivery/SHA256.txt
          test -s delivery/Seminar11_OOP_Visual_Concepts_EN_QA_FINAL_pqh.mp4
          ls -lh delivery

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: seminar11-oop-visual-concepts-pqh
          path: delivery/
          if-no-files-found: error
          retention-days: 7
