name: Render Seminar 11 Class 03 V2

on:
  pull_request:
    branches: [main]
    paths:
      - 'render_jobs/seminar11_class03_v2/**'
      - '.github/workflows/render-seminar11-class03-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seminar11-class03-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and statically validate V2 source
        shell: bash
        run: |
          set -euo pipefail
          JOB='render_jobs/seminar11_class03_v2'
          base64 -d "$JOB/Seminar11_Class03_Constructors_ValidState_V2_FINAL.py.gz.b64" > "$JOB/scene.py.gz"
          gzip -dc "$JOB/scene.py.gz" > "$JOB/Seminar11_Class03_Constructors_ValidState_V2_FINAL.py"
          python -m py_compile "$JOB/Seminar11_Class03_Constructors_ValidState_V2_FINAL.py"
          grep -nE 'V2 QA FIX|CONSTRUCTOR MENTAL MODEL|SELF AND PARAMETERS|VALID INITIAL STATE|UML ↔ CODE SYNCHRONIZATION|M09 · CONSTRUCTORS' "$JOB/Seminar11_Class03_Constructors_ValidState_V2_FINAL.py" > /tmp/curricular_v2.txt
          ! grep -n 'ReplacementTransform(old, new)' "$JOB/Seminar11_Class03_Constructors_ValidState_V2_FINAL.py"

      - name: Prepare renderer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1 >/dev/null
          mkdir -p out
          cp /tmp/curricular_v2.txt out/CURRICULAR_QA_V2.txt

      - name: PQL full-scene QA
        shell: bash
        run: |
          set -euo pipefail
          JOB='render_jobs/seminar11_class03_v2'
          rm -rf media_pql
          docker run --rm --user "$(id -u):$(id -g)"             -e HOME=/tmp/manim-home             -e LESSON_TIME_SCALE=0.14             -v "$PWD:/manim" -w /manim             --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql $JOB/Seminar11_Class03_Constructors_ValidState_V2_FINAL.py                 Seminar11Class03ConstructorsValidState                 --format=mp4 --media_dir media_pql --disable_caching
            " 2>&1 | tee out/render_pql_v2.log
          P="$(find media_pql -type f -name 'Seminar11Class03ConstructorsValidState.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$P" && test -s "$P"

      - name: PQH final render
        shell: bash
        run: |
          set -euo pipefail
          JOB='render_jobs/seminar11_class03_v2'
          rm -rf media
          docker run --rm --user "$(id -u):$(id -g)"             -e HOME=/tmp/manim-home             -e LESSON_TIME_SCALE=1.45             -v "$PWD:/manim" -w /manim             --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh $JOB/Seminar11_Class03_Constructors_ValidState_V2_FINAL.py                 Seminar11Class03ConstructorsValidState                 --fps 30 --format=mp4 --media_dir media --disable_caching
            " 2>&1 | tee out/render_pqh_v2.log
          F="$(find media -type f -name 'Seminar11Class03ConstructorsValidState.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$F" && test -s "$F"
          cp "$F" out/Seminar11_Class03_Constructors_Valid_State_V2_SENIOR_FINAL_pqh.mp4
          cp "$JOB/Seminar11_Class03_Constructors_ValidState_V2_FINAL.py" out/

      - name: Strict technical QA and frame extraction
        shell: bash
        run: |
          set -euo pipefail
          F='out/Seminar11_Class03_Constructors_Valid_State_V2_SENIOR_FINAL_pqh.mp4'
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(ffprobe -v error -show_entries format=size -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n'             "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > out/VIDEO_TECHNICAL_V2.tsv
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          python - "$DUR" <<'PY'
          import sys
          d=float(sys.argv[1])
          if not 260 <= d <= 430:
              raise SystemExit(f'duration outside class envelope: {d:.3f}s')
          PY
          ffmpeg -nostdin -v error -i "$F" -f null - 2> out/full_decode_v2.log

          mkdir -p out/audit_frames
          python - "$DUR" <<'PY' > /tmp/times.tsv
          import sys
          d=float(sys.argv[1])
          for i,p in enumerate([.025,.07,.12,.18,.24,.30,.36,.42,.48,.54,.60,.66,.72,.78,.84,.90,.95,.985]):
              print(f'{i:02d}\t{d*p:.4f}')
          PY
          while IFS=$'\t' read -r N T; do
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "out/audit_frames/${N}.png"
          done < /tmp/times.tsv

          sha256sum "$F" out/Seminar11_Class03_Constructors_ValidState_V2_FINAL.py > out/SHA256SUMS_V2.txt
          cat > out/RENDER_REPORT_V2.md <<EOF
          # Seminar 11 · Class 03 V2 render report

          - Scene: Seminar11Class03ConstructorsValidState
          - Output: Seminar11_Class03_Constructors_Valid_State_V2_SENIOR_FINAL_pqh.mp4
          - ManimCE: 0.20.1
          - Resolution: ${W} × ${H}
          - FPS: ${FPS}
          - Codec / pixel format: ${CODEC} / ${PIX}
          - Duration: ${DUR} s
          - V2 visual fixes: non-overlapping header transitions; larger headers, subtitles, object cards, UML labels, code and diagrams; more screen utilization; preserved monochrome Class 1–2 grammar.
          - QA: py_compile, PQL, PQH, ffprobe, full FFmpeg decode, 18 representative frames, SHA-256.
          EOF

      - name: Upload verified V2 package
        uses: actions/upload-artifact@v4
        with:
          name: Seminar11-Class03-V2-SENIOR-PQH
          path: |
            out/Seminar11_Class03_Constructors_Valid_State_V2_SENIOR_FINAL_pqh.mp4
            out/Seminar11_Class03_Constructors_ValidState_V2_FINAL.py
            out/VIDEO_TECHNICAL_V2.tsv
            out/CURRICULAR_QA_V2.txt
            out/SHA256SUMS_V2.txt
            out/RENDER_REPORT_V2.md
            out/render_pql_v2.log
            out/render_pqh_v2.log
            out/full_decode_v2.log
            out/audit_frames/
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct-download V2 branch
        if: success() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        env:
          DELIVERY_BRANCH: delivery/seminar11-class03-v2-20260923
        run: |
          set -euo pipefail
          cp -a out /tmp/class03_v2_delivery
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan "$DELIVERY_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p seminar11_class03_v2
          cp -a /tmp/class03_v2_delivery/. seminar11_class03_v2/
          git add seminar11_class03_v2
          git commit -m 'Publish Seminar 11 Class 03 V2 PQH render'
          git push --force origin "HEAD:$DELIVERY_BRANCH"
