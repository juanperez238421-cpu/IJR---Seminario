name: Render Semillero Levels ManimCE PQH

on:
  push:
    branches:
      - render/semillero-levels-pqh-20260805
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout render branch
        uses: actions/checkout@v4

      - name: Reconstruct and validate Python source
        shell: bash
        run: |
          set -euo pipefail
          cat .render_chunks/semillero_part_*.pyfrag > semillero_programacion_tres_niveles_manimce.py
          echo "1380bfe9a349262df4111ca45211a42020b1ac5edac037529729d6e7fe9484f9  semillero_programacion_tres_niveles_manimce.py" | sha256sum -c -
          python -m py_compile semillero_programacion_tres_niveles_manimce.py
          grep -n '^class SemilleroProgramacionTresNiveles(Scene):' semillero_programacion_tres_niveles_manimce.py
          ! grep -n 'camera\.frame' semillero_programacion_tres_niveles_manimce.py
          ! grep -n 'MovingCameraScene' semillero_programacion_tres_niveles_manimce.py

      - name: Pull official ManimCE image
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1

      - name: Prepare writable output directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media delivery qa
          chmod -R u+rwx media delivery qa

      - name: Accelerated complete QA render with literal -pql
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.12 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pql \
                semillero_programacion_tres_niveles_manimce.py \
                SemilleroProgramacionTresNiveles \
                --format=mp4 \
                --renderer=cairo \
                --disable_caching
            ' 2>&1 | tee render_pql.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0

      - name: Final native ManimCE render with literal -pqh
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pqh \
                semillero_programacion_tres_niveles_manimce.py \
                SemilleroProgramacionTresNiveles \
                --format=mp4 \
                --renderer=cairo \
                --disable_caching
            ' 2>&1 | tee render_pqh.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0

      - name: Locate and verify final MP4
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(find media -type f -name 'SemilleroProgramacionTresNiveles.mp4' -path '*1080p30*' -print -quit)"
          if [ -z "$VIDEO" ]; then
            VIDEO="$(find media -type f -name 'SemilleroProgramacionTresNiveles.mp4' -print -quit)"
          fi
          test -n "$VIDEO"
          test -s "$VIDEO"
          echo "video=$VIDEO" >> "$GITHUB_OUTPUT"
          ls -lh "$VIDEO"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e VIDEO_REL="$VIDEO" \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              ffprobe -v error \
                -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
                -show_entries format=duration,size \
                -of default=noprint_wrappers=1 \
                "$VIDEO_REL" | tee ffprobe.txt
              ffmpeg -v error -i "$VIDEO_REL" -f null -
              ffmpeg -y -ss 00:00:05 -i "$VIDEO_REL" -frames:v 1 qa/frame_05s.png
              ffmpeg -y -ss 00:00:30 -i "$VIDEO_REL" -frames:v 1 qa/frame_30s.png
              ffmpeg -y -sseof -5 -i "$VIDEO_REL" -frames:v 1 qa/frame_final.png
            '

      - name: Stage reproducible delivery
        shell: bash
        env:
          VIDEO: ${{ steps.verify.outputs.video }}
        run: |
          set -euo pipefail
          cp "$VIDEO" delivery/Semillero_Tres_Niveles_ManimCE_PQH_1080p30.mp4
          cp semillero_programacion_tres_niveles_manimce.py delivery/
          cp render_pql.log render_pqh.log ffprobe.txt delivery/
          cp qa/frame_05s.png qa/frame_30s.png qa/frame_final.png delivery/
          cat > delivery/RENDER_INFO.txt <<'EOF'
          Scene: SemilleroProgramacionTresNiveles
          Source: semillero_programacion_tres_niveles_manimce.py
          ManimCE: 0.20.1
          Renderer: Cairo
          Preview command:
          manim -pql semillero_programacion_tres_niveles_manimce.py SemilleroProgramacionTresNiveles --format=mp4 --renderer=cairo --disable_caching
          Final command:
          manim -pqh semillero_programacion_tres_niveles_manimce.py SemilleroProgramacionTresNiveles --format=mp4 --renderer=cairo --disable_caching
          Camera: static Scene; no camera.frame animation or external interpolation
          EOF
          sha256sum delivery/* > delivery/SHA256SUMS.txt

      - name: Upload verified render artifact
        uses: actions/upload-artifact@v4
        with:
          name: Semillero_Tres_Niveles_ManimCE_PQH
          path: delivery/
          if-no-files-found: error
          retention-days: 7
