name: Render Seminar 11 Class 04 Encapsulation

on:
  pull_request:
    branches: [main]
    paths:
      - 'render_jobs/seminar11_class04/**'
      - '.github/workflows/render-seminar11-class04.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seminar11-class04-encapsulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Static source and curriculum QA
        shell: bash
        run: |
          set -euo pipefail
          JOB='render_jobs/seminar11_class04'
          SRC="$JOB/Seminar11_Class04_Encapsulation_Visibility.py"
          python -m py_compile "$SRC"
          grep -nE 'CLASS 04|ENCAPSULATION|VISIBILITY|@property|@valor.setter|self\._valor|private|public|protected|-273\.15|MODULE m10' "$SRC" > /tmp/curricular_qa.txt
          grep -q 'Seminar11Class04EncapsulationVisibility' "$SRC"
          grep -q 'UML VISIBILITY' "$SRC"
          grep -q 'invalid change must be rejected' "$SRC"

      - name: Prepare ManimCE 0.20.1 and verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1 >/dev/null
          mkdir -p out
          cp /tmp/curricular_qa.txt out/CURRICULAR_QA.txt

      - name: Literal PQL full-scene QA render
        shell: bash
        run: |
          set -euo pipefail
          JOB='render_jobs/seminar11_class04'
          SRC="$JOB/Seminar11_Class04_Encapsulation_Visibility.py"
          rm -rf media_pql
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.10 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pql $SRC Seminar11Class04EncapsulationVisibility \
                --format=mp4 --media_dir media_pql --disable_caching
            " 2>&1 | tee out/render_pql.log
          P="$(find media_pql -type f -name 'Seminar11Class04EncapsulationVisibility.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$P" && test -s "$P"

      - name: Literal PQH final render
        shell: bash
        run: |
          set -euo pipefail
          JOB='render_jobs/seminar11_class04'
          SRC="$JOB/Seminar11_Class04_Encapsulation_Visibility.py"
          rm -rf media
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.82 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=/tmp/manim-bin:\$PATH
              manim -pqh $SRC Seminar11Class04EncapsulationVisibility \
                --fps 30 --format=mp4 --media_dir media --disable_caching
            " 2>&1 | tee out/render_pqh.log
          F="$(find media -type f -name 'Seminar11Class04EncapsulationVisibility.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$F" && test -s "$F"
          cp "$F" out/Seminar11_Class04_Encapsulation_Visibility_FINAL_pqh.mp4
          cp "$SRC" out/

      - name: Strict technical QA and representative frames
        shell: bash
        run: |
          set -euo pipefail
          F='out/Seminar11_Class04_Encapsulation_Visibility_FINAL_pqh.mp4'
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$F")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$F")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$F")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$F")"
          PIX="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$F")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          SIZE="$(ffprobe -v error -show_entries format=size -of csv=p=0 "$F")"
          printf 'width\theight\tfps\tcodec\tpix_fmt\tduration\tsize\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$W" "$H" "$FPS" "$CODEC" "$PIX" "$DUR" "$SIZE" > out/VIDEO_TECHNICAL.tsv
          test "$W" = 1920
          test "$H" = 1080
          test "$FPS" = 30/1
          test "$CODEC" = h264
          test "$PIX" = yuv420p
          python - "$DUR" <<'PY'
          import sys
          d=float(sys.argv[1])
          if not 150 <= d <= 260:
              raise SystemExit(f'duration outside senior target envelope: {d:.3f}s')
          PY
          ffmpeg -nostdin -v error -i "$F" -f null - 2> out/full_decode.log

          mkdir -p out/audit_frames
          python - "$DUR" <<'PY' > /tmp/frame_times.tsv
          import sys
          d=float(sys.argv[1])
          points=[
              ('00_opening',0.035),
              ('01_direct_mutation',0.115),
              ('02_encapsulation_model',0.195),
              ('03_uml_visibility',0.275),
              ('04_python_internal',0.355),
              ('05_property',0.435),
              ('06_setter_validation',0.520),
              ('07_java_visibility',0.610),
              ('08_purposeful_getters',0.700),
              ('09_invariant_flow',0.785),
              ('10_project_transfer',0.870),
              ('11_evidence',0.935),
              ('12_exit',0.980),
          ]
          for name,p in points:
              print(f'{name}\t{d*p:.4f}')
          PY
          while IFS=$'\t' read -r NAME T; do
            ffmpeg -nostdin -loglevel error -ss "$T" -i "$F" -frames:v 1 "out/audit_frames/${NAME}.png"
          done < /tmp/frame_times.tsv

          sha256sum \
            out/Seminar11_Class04_Encapsulation_Visibility_FINAL_pqh.mp4 \
            out/Seminar11_Class04_Encapsulation_Visibility.py > out/SHA256SUMS.txt

          cat > out/RENDER_REPORT.md <<EOF
          # Seminar 11 · Class 04 render report

          - Scene: \`Seminar11Class04EncapsulationVisibility\`
          - Topic: Encapsulation & Visibility
          - Curriculum: Common Core Week 4 / module m10 / protected state
          - ManimCE: 0.20.1
          - Final output: \`Seminar11_Class04_Encapsulation_Visibility_FINAL_pqh.mp4\`
          - Duration: ${DUR} s
          - Resolution: ${W} × ${H}
          - FPS: ${FPS}
          - Codec / pixel format: ${CODEC} / ${PIX}
          - Preview: literal full-scene \`-pql\`, LESSON_TIME_SCALE=0.10
          - Final: literal \`-pqh\`, 30 fps, LESSON_TIME_SCALE=0.82
          - QA: py_compile + curriculum grep + PQL + PQH + ffprobe + full decode + 13 frames + SHA-256
          - Required evidence: protected state + one enforced rule + UML + / - / #.
          EOF

      - name: Upload verified render package
        uses: actions/upload-artifact@v4
        with:
          name: Seminar11-Class04-Encapsulation-Visibility-PQH
          path: |
            out/Seminar11_Class04_Encapsulation_Visibility_FINAL_pqh.mp4
            out/Seminar11_Class04_Encapsulation_Visibility.py
            out/VIDEO_TECHNICAL.tsv
            out/CURRICULAR_QA.txt
            out/SHA256SUMS.txt
            out/RENDER_REPORT.md
            out/render_pql.log
            out/render_pqh.log
            out/full_decode.log
            out/audit_frames/
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct-download delivery branch
        if: success()
        shell: bash
        env:
          DELIVERY_BRANCH: delivery/seminar11-class04-encapsulation-visibility-20260904
        run: |
          set -euo pipefail
          cp -a out /tmp/class04_delivery
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan "$DELIVERY_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p seminar11_class04
          cp -a /tmp/class04_delivery/. seminar11_class04/
          git add seminar11_class04
          git commit -m 'Publish Seminar 11 Class 04 verified PQH render'
          git push --force origin "HEAD:$DELIVERY_BRANCH"
