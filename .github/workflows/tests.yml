name: JavaScript tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          node --check scripts/monitor-students.mjs
          node --check js/monitor.js
          node --check js/progress-roster-bootstrap.js

      - name: Run tests
        run: npm test
