name: Deploy Seminar T3 Supabase Backend

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "t3/oop-logic-01/**"
      - "t3/index.html"
      - ".github/workflows/deploy-seminar-t3-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  SUPABASE_PROJECT_REF: rlfxnjbqxbozjdzkbwlz
  SEMINAR_HOST: https://rlfxnjbqxbozjdzkbwlz.supabase.co/functions/v1/seminar-t3-host

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Seminar course
        uses: actions/checkout@v6

      - name: Checkout shared academic backend baseline
        uses: actions/checkout@v6
        with:
          repository: juanperez238421-cpu/ijr-estadistica-11-2026
          ref: main
          path: _shared_backend

      - name: Validate deployment secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the two Supabase deployment secrets in Repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Prepare migration workspace without history drift
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/seminar-supabase
          cp -R _shared_backend/supabase /tmp/seminar-supabase
          mkdir -p /tmp/seminar-supabase/migrations
          cp supabase/migrations/*.sql /tmp/seminar-supabase/migrations/
          test -s /tmp/seminar-supabase/migrations/20260819190000_seminar_t3_dual_language_course.sql
          test -s /tmp/seminar-supabase/migrations/20260819190100_seminar_t3_start_team_qa_fix.sql
          test -s /tmp/seminar-supabase/migrations/20260821142615_seminar_oop_logic_01_question_lab.sql
          test -s /tmp/seminar-supabase/migrations/20260821142641_seminar_oop_logic_01_teacher_projection_fix.sql
          test -s /tmp/seminar-supabase/migrations/20260821142857_seminar_oop_logic_01_prompt_cleanup.sql

      - name: Verify OOP Logic Lab static contract
        shell: bash
        run: |
          set -euo pipefail
          test -s t3/oop-logic-01/index.html
          test -s t3/oop-logic-01/app.js
          test -s t3/oop-logic-01/config.js
          test -s t3/oop-logic-01/teacher.html
          test -s t3/oop-logic-01/teacher.js
          node --check t3/oop-logic-01/config.js
          node --check t3/oop-logic-01/app.js
          node --check t3/oop-logic-01/teacher.js
          grep -q "questionCount: 12" t3/oop-logic-01/config.js
          grep -q "variantBankSize: 36" t3/oop-logic-01/config.js
          grep -q "seminar_oop_submit_v1" t3/oop-logic-01/config.js
          grep -q "teacher_seminar_oop_dashboard_v1" t3/oop-logic-01/config.js

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link shared project
        working-directory: /tmp/seminar-supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply Seminar migration on top of shared baseline
        working-directory: /tmp/seminar-supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --include-all

      - name: Smoke-test OOP Logic Lab production host
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$SEMINAR_HOST/oop-logic-01/" -o /tmp/oop-student.html \
              && curl -fsSL "$SEMINAR_HOST/oop-logic-01/teacher.html" -o /tmp/oop-teacher.html \
              && grep -q "OOP Logic Lab 01" /tmp/oop-student.html \
              && grep -q "Registro maestro" /tmp/oop-teacher.html; then
              exit 0
            fi
            sleep 8
          done
          echo "OOP Logic Lab production host smoke test failed after retries."
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          echo "### Seminar T3 backend migration applied" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: $SUPABASE_PROJECT_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "- Course: seminario-programacion-t3-2026" >> "$GITHUB_STEP_SUMMARY"
          echo "- Routes: Python + Java" >> "$GITHUB_STEP_SUMMARY"
          echo "- Modules: 16 per route" >> "$GITHUB_STEP_SUMMARY"
          echo "- OOP Logic Lab: 12 questions / 36 packs" >> "$GITHUB_STEP_SUMMARY"
          echo "- Team size: 1-3 students" >> "$GITHUB_STEP_SUMMARY"

      - name: Report production status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            label="✅ BACKEND READY"
          else
            label="❌ BACKEND NOT READY"
          fi
          gh issue comment 17 \
            --repo juanperez238421-cpu/IJR---Seminario \
            --body "$label · Deploy Seminar T3 Supabase Backend · run $RUN_ID · commit $SHA · $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
