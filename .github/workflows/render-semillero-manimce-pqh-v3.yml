name: Render Semillero Levels ManimCE PQH V3

on:
  push:
    branches: [render/semillero-levels-pqh-20260805]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and validate corrected source
        shell: bash
        run: |
          set -euo pipefail
          cat .render_chunks/semillero_part_*.pyfrag > semillero_programacion_tres_niveles_manimce.py
          echo "dc7ce212776861ae672da1c4ee2851e6238a5689f344cd2481d4495e370ccc82  semillero_programacion_tres_niveles_manimce.py" | sha256sum -c -
          python -m py_compile semillero_programacion_tres_niveles_manimce.py
          grep -n '^class SemilleroProgramacionTresNiveles(Scene):' semillero_programacion_tres_niveles_manimce.py
          ! grep -n 'camera\.frame\|MovingCameraScene' semillero_programacion_tres_niveles_manimce.py

      - name: Pull official ManimCE
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Prepare output
        run: mkdir -p media delivery qa && chmod -R u+rwx media delivery qa

      - name: Native complete pql test
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.12 \
            -v "$PWD:/manim" -w /manim --entrypoint bash \
            manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/bin/xdg-open
              chmod +x /tmp/bin/xdg-open
              export PATH="/tmp/bin:$PATH"
              manim -pql semillero_programacion_tres_niveles_manimce.py \
                SemilleroProgramacionTresNiveles --format=mp4 \
                --renderer=cairo --disable_caching
            ' 2>&1 | tee render_pql.log

      - name: Native final pqh render
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w /manim --entrypoint bash \
            manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/bin/xdg-open
              chmod +x /tmp/bin/xdg-open
              export PATH="/tmp/bin:$PATH"
              manim -pqh semillero_programacion_tres_niveles_manimce.py \
                SemilleroProgramacionTresNiveles --format=mp4 \
                --renderer=cairo --disable_caching
            ' 2>&1 | tee render_pqh.log

      - name: Select and verify final video
        shell: bash
        run: |
          set -euo pipefail
          find media -type f -name '*.mp4' -printf '%T@ %s %p\n' | sort -nr | tee mp4_inventory.txt
          VIDEO="$(find media -type f -name 'SemilleroProgramacionTresNiveles.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$VIDEO" && test -s "$VIDEO"
          printf '%s\n' "$VIDEO" > final_video_path.txt
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size -of default=noprint_wrappers=1 "$VIDEO" | tee ffprobe.txt
          grep -q '^codec_name=h264$' ffprobe.txt
          grep -q '^width=1920$' ffprobe.txt
          grep -q '^height=1080$' ffprobe.txt
          grep -q '^r_frame_rate=30/1$' ffprobe.txt
          grep -q '^pix_fmt=yuv420p$' ffprobe.txt
          ffmpeg -v error -i "$VIDEO" -f null -
          ffmpeg -y -ss 00:00:05 -i "$VIDEO" -frames:v 1 qa/frame_05s.png
          ffmpeg -y -ss 00:00:30 -i "$VIDEO" -frames:v 1 qa/frame_30s.png
          ffmpeg -y -sseof -5 -i "$VIDEO" -frames:v 1 qa/frame_final.png

      - name: Stage delivery
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(cat final_video_path.txt)"
          cp "$VIDEO" delivery/Semillero_Tres_Niveles_ManimCE_PQH_1080p30.mp4
          cp semillero_programacion_tres_niveles_manimce.py delivery/
          cp render_pql.log render_pqh.log ffprobe.txt mp4_inventory.txt final_video_path.txt delivery/
          cp qa/*.png delivery/
          cat > delivery/RENDER_INFO.txt <<'EOF'
          Scene: SemilleroProgramacionTresNiveles
          Source: semillero_programacion_tres_niveles_manimce.py
          ManimCE: 0.20.1
          Renderer: Cairo
          Resolution: 1920 x 1080
          FPS: 30
          Preview: manim -pql semillero_programacion_tres_niveles_manimce.py SemilleroProgramacionTresNiveles --format=mp4 --renderer=cairo --disable_caching
          Final: manim -pqh semillero_programacion_tres_niveles_manimce.py SemilleroProgramacionTresNiveles --format=mp4 --renderer=cairo --disable_caching
          Stability: static Scene; no MovingCameraScene; no camera.frame; no external interpolation.
          Visual QA correction: final closing text fitted to 14.0 frame units.
          EOF
          sha256sum delivery/* > delivery/SHA256SUMS.txt

      - name: Upload verified corrected artifact
        uses: actions/upload-artifact@v4
        with:
          name: Semillero_Tres_Niveles_ManimCE_PQH_V3
          path: delivery/
          if-no-files-found: error
          retention-days: 7
