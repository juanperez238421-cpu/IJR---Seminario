name: Validate Seminar T3 Frontend

on:
  push:
    branches:
      - main
    paths:
      - "t3/**"
      - "monitor.html"
      - "progress.html"
      - "index.html"
      - "css/**"
      - "js/**"
      - "data/**"
      - "tests/**"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    paths:
      - "t3/**"
      - "tests/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seminar-frontend-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate existing seminar source files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s monitor.html
          test -s progress.html
          test -s data/students.json
          test -s data/monitor/latest.json
          python -m json.tool data/students.json >/dev/null
          python -m json.tool data/monitor/latest.json >/dev/null

      - name: Validate T3 dual-language course
        shell: bash
        run: |
          set -euo pipefail
          test -s t3/index.html
          test -s t3/lab.html
          test -s t3/teacher.html
          test -s t3/data/course-index.json
          python -m json.tool t3/data/course-index.json >/dev/null
          python -m json.tool t3/data/source-map.json >/dev/null
          for f in t3/data/modules/*.json; do python -m json.tool "$f" >/dev/null; done
          node --check t3/config.js
          node --check t3/js/course.js
          node --check t3/js/course-store.js
          node --check t3/js/lab.js
          node --check t3/js/scoring-core.js
          node --check t3/js/teacher.js

      - name: Validate Python OOP Colab source and master
        shell: bash
        run: |
          set -euo pipefail
          test -s t3/oop-logic-01/index.html
          test -s t3/oop-logic-01/teacher.html
          test -s t3/oop-logic-01/config.js
          test -s t3/oop-logic-01/app.js
          test -s t3/oop-logic-01/styles.css
          test -s t3/oop-logic-01/teacher.js
          test -s t3/oop-logic-01/teacher.css
          node --check t3/oop-logic-01/config.js
          node --check t3/oop-logic-01/app.js
          node --check t3/oop-logic-01/teacher.js
          grep -q "pyodide/v0.27.7" t3/oop-logic-01/index.html
          grep -q "seminar11-oop-colab-01-2026" t3/oop-logic-01/config.js
          grep -q "teacher_seminar_oop_colab_dashboard_v1" t3/oop-logic-01/config.js

      - name: Run JavaScript contract tests
        run: npm test

      - name: Document canonical classroom host
        shell: bash
        run: |
          echo "### Seminar 11 Python OOP Colab" >> "$GITHUB_STEP_SUMMARY"
          echo "The source is maintained in this repository." >> "$GITHUB_STEP_SUMMARY"
          echo "The canonical classroom HTML is deployed through the already-enabled GitHub Pages site in ijr-estadistica-11-2026:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Student: https://juanperez238421-cpu.github.io/ijr-estadistica-11-2026/seminario-oop-colab-01/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Master: https://juanperez238421-cpu.github.io/ijr-estadistica-11-2026/seminario-oop-colab-01/teacher.html" >> "$GITHUB_STEP_SUMMARY"
