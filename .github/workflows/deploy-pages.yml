name: Deploy Seminar T3 to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "t3/**"
      - "monitor.html"
      - "progress.html"
      - "index.html"
      - "css/**"
      - "js/**"
      - "data/**"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    paths:
      - "t3/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate existing seminar source files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s monitor.html
          test -s progress.html
          test -s data/students.json
          test -s data/monitor/latest.json
          python -m json.tool data/students.json >/dev/null
          python -m json.tool data/monitor/latest.json >/dev/null

      - name: Validate T3 dual-language course
        shell: bash
        run: |
          set -euo pipefail
          test -s t3/index.html
          test -s t3/lab.html
          test -s t3/teacher.html
          test -s t3/data/course-index.json
          python -m json.tool t3/data/course-index.json >/dev/null
          python -m json.tool t3/data/source-map.json >/dev/null
          for f in t3/data/modules/*.json; do python -m json.tool "$f" >/dev/null; done
          node --check t3/config.js
          node --check t3/js/course.js
          node --check t3/js/course-store.js
          node --check t3/js/lab.js
          node --check t3/js/scoring-core.js
          node --check t3/js/teacher.js
          npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish course URLs
        shell: bash
        run: |
          echo "### Seminar T3 production URLs" >> "$GITHUB_STEP_SUMMARY"
          echo "- Student: ${{ steps.deployment.outputs.page_url }}t3/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Teacher: ${{ steps.deployment.outputs.page_url }}t3/teacher.html" >> "$GITHUB_STEP_SUMMARY"
