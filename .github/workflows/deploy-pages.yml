name: Validate published seminar dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate dashboard source files
        shell: bash
        run: |
          set -euo pipefail
          test -s monitor.html
          test -s data/students.json
          test -s data/monitor/latest.json
          python -m json.tool data/students.json >/dev/null
          python -m json.tool data/monitor/latest.json >/dev/null
          echo "Dashboard source files are valid."
          echo "Published URL: https://juanperez238421-cpu.github.io/IJR---Seminario/monitor.html"

      - name: Explain hosting target
        run: |
          echo "The public dashboard is hosted in juanperez238421-cpu/juanperez238421-cpu.github.io."
          echo "This repository remains the source of roster and monitoring data."
