name: Validate Seminar T3 Production Host

on:
  push:
    branches: [main]
    paths:
      - "t3/**"
      - "encuesta*.html"
      - "index.html"
      - "css/**"
      - "js/**"
      - "tests/**"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    paths:
      - "t3/**"
      - "encuesta*.html"
      - "tests/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seminar-t3-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate privacy baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test ! -e monitor.html
          test ! -e progress.html
          test ! -e data/students.json
          test ! -e data/attendance/2026-07-28.json
      - name: Validate T3 dual-language course
        shell: bash
        run: |
          set -euo pipefail
          test -s t3/index.html
          test -s t3/lab.html
          test -s t3/teacher.html
          test -s t3/data/course-index.json
          python -m json.tool t3/data/course-index.json >/dev/null
          python -m json.tool t3/data/source-map.json >/dev/null
          for f in t3/data/modules/*.json; do python -m json.tool "$f" >/dev/null; done
          node --check t3/config.js
          node --check t3/js/course.js
          node --check t3/js/course-store.js
          node --check t3/js/lab.js
          node --check t3/js/scoring-core.js
          node --check t3/js/teacher.js
      - name: Validate OOP Colab and Software Engineering Studio
        shell: bash
        run: |
          set -euo pipefail
          test -s t3/oop-logic-01/index.html
          test -s t3/oop-logic-01/teacher.html
          node --check t3/oop-logic-01/config.js
          node --check t3/oop-logic-01/app.js
          node --check t3/oop-logic-01/teacher.js
          grep -q "pyodide/v0.27.7" t3/oop-logic-01/index.html
          test -s t3/studio/index.html
          test -s t3/studio/app.js
          test -s t3/studio/teacher.html
          test -s t3/studio/teacher.js
          test -s t3/common/index.html
          test -s t3/data/studio-index.json
          python -m json.tool t3/data/studio-index.json >/dev/null
          node --check t3/studio/app.js
          node --check t3/studio/teacher.js
          node --check t3/tracks/track.js
          test -s t3/projects/index.html
          test -s t3/projects/projects.js
          test -s t3/projects/projects.css
          node --check t3/projects/projects.js
          grep -q 'href="projects/"' t3/index.html
          grep -q 'seminar-project-access' t3/projects/projects.js
          grep -q 'save_decision' t3/projects/projects.js
          grep -q 'Project Decision Center' t3/projects/index.html
          for track in web data-science cybersecurity 3d-programming robotics; do test -s "t3/tracks/$track/index.html"; done
      - name: Validate OOP + UML Learning Hub
        shell: bash
        run: |
          set -euo pipefail
          test -s t3/oop-uml/index.html
          test -s t3/oop-uml/theory.html
          test -s t3/oop-uml/workshop.html
          test -s t3/oop-uml/styles.css
          test -s t3/oop-uml/course-data.js
          test -s t3/oop-uml/hub.js
          node --check t3/oop-uml/course-data.js
          node --check t3/oop-uml/hub.js
          grep -q "CourseStore" t3/oop-uml/hub.js
          grep -q 'id="institutionalEmail"' t3/oop-uml/index.html
          grep -q 'type="email"' t3/oop-uml/index.html
          ! grep -q 'id="memberName1"' t3/oop-uml/index.html
          ! grep -q 'id="groupCode"' t3/oop-uml/index.html
          ! grep -q 'id="registrationMode"' t3/oop-uml/index.html
          grep -q "ensureEmailOnlyRegistration" t3/oop-uml/hub.js
          grep -q 'data-oop-uml-build="20260923-email-v12"' t3/oop-uml/index.html
          grep -q 'OOP_UML_EMAIL_BUILD = "20260923-email-v12"' supabase/functions/seminar-t3-host/index.ts
          grep -q "rewriteOopUmlHtml" supabase/functions/seminar-t3-host/index.ts
          grep -q "Supabase" t3/oop-uml/index.html
          grep -q "oop-uml/" t3/index.html
          grep -q "seminar_email_access_v1" t3/access-gate.js
          grep -q "institutional_email_not_registered" t3/access-gate.js
          ! grep -q "No tengo correo institucional" t3/access-gate.js
          ! grep -q "Acceso al sitio" t3/access-gate.js
      - name: Run JavaScript contract tests
        run: npm test

  production-smoke:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Smoke-test live Supabase static host
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://rlfxnjbqxbozjdzkbwlz.supabase.co/functions/v1/seminar-t3-host"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --retry 2 --connect-timeout 10 "$BASE/projects/" -o /tmp/projects.html               && grep -q "Project Decision Center" /tmp/projects.html; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
          curl -fsS --retry 2 --connect-timeout 10 "$BASE/projects/projects.js" -o /tmp/projects.js
          curl -fsS --retry 2 --connect-timeout 10 "$BASE/projects/projects.css" -o /tmp/projects.css
          grep -q "save_decision" /tmp/projects.js
          grep -q "option-card" /tmp/projects.css

          curl -fsS -D /tmp/oop-uml.headers -H "Cache-Control: no-cache" --retry 2 --connect-timeout 10 "$BASE/oop-uml/?v=20260923-email-v12" -o /tmp/oop-uml.html
          curl -fsS -H "Cache-Control: no-cache" --retry 2 --connect-timeout 10 "$BASE/oop-uml/hub.js?v=20260923-email-v12" -o /tmp/oop-uml-hub.js
          grep -q 'id="institutionalEmail"' /tmp/oop-uml.html
          grep -q 'type="email"' /tmp/oop-uml.html
          grep -q 'data-oop-uml-build="20260923-email-v12"' /tmp/oop-uml.html
          grep -q 'Sign in with your institutional email.' /tmp/oop-uml.html
          ! grep -q 'Register the student or exact classroom team' /tmp/oop-uml.html
          ! grep -q 'id="memberName1"' /tmp/oop-uml.html
          ! grep -q 'id="groupCode"' /tmp/oop-uml.html
          ! grep -q 'id="registrationMode"' /tmp/oop-uml.html
          ! grep -q 'Full name' /tmp/oop-uml.html
          grep -q "ensureEmailOnlyRegistration" /tmp/oop-uml-hub.js
          grep -q "startWithEmail" /tmp/oop-uml-hub.js
          curl -fsS -H "Cache-Control: no-cache" --retry 2 --connect-timeout 10 "$BASE/access-gate.js?v=20260923-email-v12" -o /tmp/access-gate.js
          grep -q "seminar_email_access_v1" /tmp/access-gate.js
          grep -q "Entrar a Seminario 11" /tmp/access-gate.js
          ! grep -q "No tengo correo institucional" /tmp/access-gate.js
          ! grep -q "Acceso al sitio" /tmp/access-gate.js
          echo "Production Seminar 11 exposes only institutional-email entry; legacy alternate-access UI is absent."
      - name: Publish production routes
        shell: bash
        run: |
          echo "### Seminar T3 production routes" >> "$GITHUB_STEP_SUMMARY"
          echo "- T3 course: https://rlfxnjbqxbozjdzkbwlz.supabase.co/functions/v1/seminar-t3-host/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project Decision Center: https://rlfxnjbqxbozjdzkbwlz.supabase.co/functions/v1/seminar-t3-host/projects/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project Studio: https://rlfxnjbqxbozjdzkbwlz.supabase.co/functions/v1/seminar-t3-host/studio/" >> "$GITHUB_STEP_SUMMARY"
