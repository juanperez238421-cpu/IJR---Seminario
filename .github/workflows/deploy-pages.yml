name: Deploy Seminar T3 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "t3/**"
      - "encuesta*.html"
      - "index.html"
      - "css/**"
      - "js/**"
      - "tests/**"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    paths:
      - "t3/**"
      - "encuesta*.html"
      - "tests/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate privacy baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test ! -e monitor.html
          test ! -e progress.html
          test ! -e data/students.json
          test ! -e data/attendance/2026-07-28.json
      - name: Validate T3 dual-language course
        shell: bash
        run: |
          set -euo pipefail
          test -s t3/index.html
          test -s t3/lab.html
          test -s t3/teacher.html
          test -s t3/data/course-index.json
          python -m json.tool t3/data/course-index.json >/dev/null
          python -m json.tool t3/data/source-map.json >/dev/null
          for f in t3/data/modules/*.json; do python -m json.tool "$f" >/dev/null; done
          node --check t3/config.js
          node --check t3/js/course.js
          node --check t3/js/course-store.js
          node --check t3/js/lab.js
          node --check t3/js/scoring-core.js
          node --check t3/js/teacher.js
      - name: Validate OOP Colab and Software Engineering Studio
        shell: bash
        run: |
          set -euo pipefail
          test -s t3/oop-logic-01/index.html
          test -s t3/oop-logic-01/teacher.html
          node --check t3/oop-logic-01/config.js
          node --check t3/oop-logic-01/app.js
          node --check t3/oop-logic-01/teacher.js
          grep -q "pyodide/v0.27.7" t3/oop-logic-01/index.html
          test -s t3/studio/index.html
          test -s t3/studio/app.js
          test -s t3/studio/teacher.html
          test -s t3/studio/teacher.js
          test -s t3/common/index.html
          test -s t3/data/studio-index.json
          python -m json.tool t3/data/studio-index.json >/dev/null
          node --check t3/studio/app.js
          node --check t3/studio/teacher.js
          node --check t3/tracks/track.js
          for track in web data-science cybersecurity 3d-programming robotics; do test -s "t3/tracks/$track/index.html"; done
      - name: Run JavaScript contract tests
        run: npm test
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish student URLs
        shell: bash
        run: |
          echo "### Seminar T3 student routes" >> "$GITHUB_STEP_SUMMARY"
          echo "- T3 course: ${{ steps.deployment.outputs.page_url }}t3/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Software Engineering Studio: ${{ steps.deployment.outputs.page_url }}t3/studio/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Common Core OOP + UML: ${{ steps.deployment.outputs.page_url }}t3/common/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Specialized tracks: ${{ steps.deployment.outputs.page_url }}t3/tracks/" >> "$GITHUB_STEP_SUMMARY"
